name: Selenium Tests

on:
  push:
    branches:
      - master
      - feature/github-action-ci

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Selenium tests
        run: mvn test -Dheadless=true